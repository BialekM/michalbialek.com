name: Wdrożenie na OVH

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "build.py"
      - "legal.py"
      - "favicon.ico"
      - ".htaccess"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zbuduj index.html ze źródła
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: python3 build.py

      - name: Przygotuj pliki do wysłania
        run: |
          mkdir -p deploy
          cp index.html favicon.ico robots.txt sitemap.xml .htaccess deploy/
          cp -r assets en polityka-prywatnosci regulamin deploy/

      - name: Wyślij na serwer FTP (folder www)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./deploy/
          server-dir: www/

      - name: Sprawdź stronę po wdrożeniu
        continue-on-error: true
        run: |
          for u in https://michalbialek.com/ https://michalbialek.com/assets/fonts/fonts.css https://michalbialek.com/en/ https://michalbialek.com/polityka-prywatnosci/ https://michalbialek.com/en/terms/ https://www.michalbialek.com/ http://michalbialek.com/ https://michalbialek.com/sitemap.xml; do
            echo "$u -> $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 20 "$u" || echo 'błąd połączenia')"
          done
